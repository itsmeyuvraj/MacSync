name: Build DMG on Main Merge

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package DMG
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Semantic Version
        id: semver
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" MacSync/Info.plist 2>/dev/null || echo "1.0.0")
          BUILD_NUM="${{ github.run_number }}"
          TAG_NAME="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=MacSync v${VERSION} (Build ${BUILD_NUM})" >> $GITHUB_OUTPUT
          echo "==> Target Version: v${VERSION} (Build #${BUILD_NUM})"

      - name: Setup Dependencies
        run: |
          echo "==> Installing libmtp, libusb, and create-dmg..."
          brew install libmtp libusb create-dmg

      - name: Build Standalone Application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package DMG Installer
        run: |
          chmod +x package-dmg.sh
          ./package-dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacSync-v${{ steps.semver.outputs.version }}-Build-${{ github.run_number }}
          path: |
            MacSync*.dmg
            MacSync*.dmg.sha256
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.semver.outputs.tag_name }}
          name: ${{ steps.semver.outputs.release_name }}
          body: |
            ## ${{ steps.semver.outputs.release_name }}

            Automated standalone DMG release built from `main`.

            - **Version:** `${{ steps.semver.outputs.version }}`
            - **Build Number:** `${{ github.run_number }}`
            - **Architecture:** Apple Silicon (ARM64)
            - **macOS Requirement:** macOS 14.0+ (Sonoma, Sequoia)

            ### Installation
            1. Download `MacSync-v${{ steps.semver.outputs.version }}.dmg` (or `MacSync.dmg`) below.
            2. Double-click to open and drag **MacSync** into **Applications**.
            3. Connect your Android device via USB in MTP / File Transfer mode.
          files: |
            MacSync*.dmg
            MacSync*.dmg.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
