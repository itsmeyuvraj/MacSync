name: Build DMG on Main Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package DMG
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          echo "==> Installing libmtp, libusb, and create-dmg..."
          brew install libmtp libusb create-dmg

      - name: Build Standalone Application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package DMG Installer
        run: |
          chmod +x package-dmg.sh
          ./package-dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacSync-DMG
          path: |
            MacSync.dmg
            MacSync.dmg.sha256
          retention-days: 14

      - name: Publish GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "MacSync Latest"
          body: |
            ## MacSync Latest Build (Run #${{ github.run_number }})

            Automated DMG installer built from merge into `main`.

            - **OS Support:** macOS 14.0+ (Sonoma, Sequoia)
            - **Architecture:** Apple Silicon (ARM64)
            - **Standalone:** Self-contained bundle with embedded `libmtp` & `libusb` libraries.

            ### Download & Installation
            1. Download `MacSync.dmg` below.
            2. Open the disk image and drag **MacSync** into **Applications**.
            3. Connect your Android device via USB (File Transfer / MTP mode).
          files: |
            MacSync.dmg
            MacSync.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
